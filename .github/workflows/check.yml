name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check source and upstream rules
        run: |
          node --check superagent.mjs
          node --check feishu-watch.ts
          for file in recipes/feishu-github/*.mjs; do node --check "$file" || exit; done
          node vendor/agent-autoloop/bin/agent-autoloop.ts check rules.workflow.example.json
